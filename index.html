<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Ralli Live</title>
<link rel="stylesheet" href="styles.css?v=29.0.0" />
</head>
<body>
<main class="app-shell">
  <section class="phone-app">
    <header class="top-tabs" id="tabs"></header>
    <div class="context-bar">
      <div class="category-zone">
        <span class="category-label">Kategooria</span>
        <div class="category-buttons" id="categoryButtons" aria-label="Kategooria"></div>
        <button class="focus-button" id="focusToggle" type="button" aria-pressed="false" hidden>TOP10 + EE</button>
      </div>
      <div class="stage-picker">
        <button class="stage-nav" id="prev" aria-label="Eelmine katse">‹</button>
        <h1 id="stageTitle">Ralli Live</h1>
        <button class="stage-nav" id="next" aria-label="Järgmine katse">›</button>
      </div>
      <div class="stage-meta">
        <span id="stageSub">Laen andmeid…</span>
        <span id="stageStats"></span>
      </div>
    </div>
    <section id="content"><p class="empty">Andmeid laaditakse…</p></section>
    <footer class="refresh-bar"><button id="refresh">↻ Värskenda</button><span id="updated"></span><small class="version">v29</small></footer>
  </section>
</main>
<script src="app.js?v=29.0.0"></script>
</body>
</html>
